name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      # Pinned: distribution shellcheck versions disagree about which codes
      # they emit, so an unpinned one turns unrelated pushes red.
      - name: Install shellcheck and bats
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" |
            tar -xJ -C /tmp
          sudo install "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Shellcheck
        run: shellcheck -s bash scripts/*.sh build/*.sh test/e2e.sh

      - name: Unit tests
        run: bats test/unit

      - name: Embed without checksums
        env:
          OPENTUNNEL_SKIP_CHECKSUMS: '1'
        run: |
          build/embed.sh
          bash -n dist/host.sh
          bash -n dist/agent.sh

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Read the pinned tailcat commit
        id: tailcat
        run: echo "commit=$(tr -d '[:space:]' < build/TAILCAT_COMMIT)" >> "$GITHUB_OUTPUT"

      - name: Check out tailcat
        uses: actions/checkout@v6.0.3
        with:
          repository: tailscale/tailcat
          ref: ${{ steps.tailcat.outputs.commit }}
          path: .tailcat-src
          # Go stamps the module version derived from the nearest tag into the
          # binary, so a checkout without tags produces different bytes than a
          # normal clone does.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: .tailcat-src/go.mod
          cache: false

      - name: Build tailcat
        env:
          TAILCAT_SRC: .tailcat-src
          TARGETS: linux/amd64
        run: build/build-tailcat.sh

      - name: Embed the served scripts
        run: build/embed.sh

      - name: End to end
        run: test/e2e.sh
