name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Check the tag matches VERSION
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag="${GITHUB_REF_NAME}"
          [ "$version" = "$tag" ] || {
            echo "VERSION ($version) does not match the tag ($tag)" >&2
            exit 1
          }

      - name: Read the pinned tailcat commit
        id: tailcat
        run: echo "commit=$(tr -d '[:space:]' < build/TAILCAT_COMMIT)" >> "$GITHUB_OUTPUT"

      - name: Check out tailcat
        uses: actions/checkout@v6.0.3
        with:
          repository: tailscale/tailcat
          ref: ${{ steps.tailcat.outputs.commit }}
          path: .tailcat-src

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: .tailcat-src/go.mod
          cache: false

      - name: Build the tailcat binaries
        env:
          TAILCAT_SRC: .tailcat-src
        run: build/build-tailcat.sh

      - name: Embed the served scripts
        run: build/embed.sh

      - name: Keep the binaries of earlier releases reachable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Already printed prompts point at /bin/<older version>/, and a
          # Workers assets deploy replaces the whole asset set, so the earlier
          # releases are rebuilt into dist/ before deploying.
          previous="$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n 3)"
          for tag in $previous; do
            echo "rebuilding tailcat for $tag"
            git -c advice.detachedHead=false checkout --quiet "$tag" -- VERSION build/TAILCAT_COMMIT || continue
            build/build-tailcat.sh || true
          done
          git checkout --quiet "${GITHUB_REF_NAME}" -- VERSION build/TAILCAT_COMMIT
          ls -1 dist/bin

      - name: Stage the assets
        run: |
          set -euo pipefail
          rm -rf site/dist
          mkdir -p site/dist
          cp dist/host.sh dist/agent.sh site/dist/
          cp -R dist/bin site/dist/bin

      # v4 or newer: older wrangler releases cannot read wrangler.jsonc.
      - name: Deploy the beta worker
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy

      - name: Smoke test the published scripts
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          curl -fsSL -o /tmp/host.sh https://beta.opentunnel.sh
          curl -fsSL -o /tmp/agent.sh https://beta.opentunnel.sh/agent
          cmp /tmp/host.sh dist/host.sh
          cmp /tmp/agent.sh dist/agent.sh
          for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            curl -fsSL -o "/tmp/tailcat_$target" "https://beta.opentunnel.sh/bin/$version/tailcat_$target"
          done
          (cd /tmp && sha256sum -c <(sed 's#tailcat_#/tmp/tailcat_#' "$GITHUB_WORKSPACE/dist/bin/$version/SHA256SUMS"))
